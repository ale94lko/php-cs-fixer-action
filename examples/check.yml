# Copy this file to `.github/workflows/php-cs-fixer.yml` in a consuming repository.
#
# `mode: check` (the Action default) runs php-cs-fixer with `--dry-run`.
# Style violations fail the step, emit inline annotations on the pull request,
# and write a markdown table to the job summary.

name: PHP Code Style

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Check coding standards
        uses: ale94lko/php-cs-fixer-action@v1
        with:
          mode: check
          # Optional: use a config file from this repository instead of
          # downloading shared rules from ale94lko/php-cs-fixer-rules.
          # config-path: .php-cs-fixer.dist.php
