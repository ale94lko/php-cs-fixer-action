version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # ncc 0.45 cannot bundle ESM-only @actions/cache 5+ / 6+ (webpackMissingModule).
      - dependency-name: "@actions/cache"
        update-types: ["version-update:semver-major"]
