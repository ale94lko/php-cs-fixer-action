version: 2
updates:
  # SHA-pinned uses: lines need a version comment (# vX.Y.Z) so Dependabot
  # can still open weekly bump PRs. See GitHub's Dependabot Actions docs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # ncc 0.45 cannot bundle ESM-only toolkit packages (webpackMissingModule).
      - dependency-name: "@actions/cache"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@actions/core"
        update-types: ["version-update:semver-major"]
