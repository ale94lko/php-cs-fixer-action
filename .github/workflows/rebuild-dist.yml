# Builds dist/ on pull_request (unprivileged). A follow-up workflow_run job
# commits that artifact without checking out PR code — Scorecard
# Dangerous-Workflow flags pull_request_target / workflow_run + PR checkout.
# https://github.com/ale94lko/php-cs-fixer-action/issues/63
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
name: Rebuild dist

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - package-lock.json
      - src/**
      - scripts/**

concurrency:
  group: rebuild-dist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and verify dist
        run: |
          npm run build
          node scripts/check-dist.cjs
          node --check dist/index.js

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
