# OpenSSF Scorecard: supply-chain checks for this public GitHub Action.
# https://github.com/ale94lko/php-cs-fixer-action/issues/27
# Accepted low scores (not a workflow regression): Fuzzing, Signed-Releases,
# CII-Best-Practices, and Branch-Protection without SCORECARD_TOKEN.
# https://github.com/ale94lko/php-cs-fixer-action/issues/53
# Do not add the README badge until this workflow has succeeded on main.
# Do not run on pull_request: publish_results only emits
# supply-chain/branch-protection and supply-chain/online-scm on the default
# branch, so a PR SARIF upload makes GitHub Code Scanning fail with
# "2 configurations not found".
name: Scorecard

on:
  # Branch-Protection only supports the default branch.
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  schedule:
    # Maintained check needs an occasional run.
    - cron: '31 4 * * 2'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Uncomment for a fuller Branch-Protection score on this public repo:
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
