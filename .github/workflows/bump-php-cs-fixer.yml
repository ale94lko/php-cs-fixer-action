# Opens a PR that bumps the default php-cs-fixer tag together with checksums.txt.
# https://github.com/ale94lko/php-cs-fixer-action/issues/17
name: Bump php-cs-fixer

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-php-cs-fixer
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Bump default php-cs-fixer if needed
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/bump-php-cs-fixer.sh

      - name: Rebuild dist
        if: steps.bump.outputs.changed == 'true'
        run: npm run build

      - name: Open pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="bump/php-cs-fixer-${TAG}"
          git checkout -B "${branch}"
          git add checksums.txt action.yml src/inputs.ts README.md docker-compose.yml CONTRIBUTING.md dist
          git commit -m "chore: bump default php-cs-fixer to ${TAG}"
          git push -u origin "HEAD:${branch}" --force
          if ! gh pr list --head "${branch}" --json number --jq 'length' | grep -qx '0'; then
            echo "Pull request for ${branch} already exists"
            exit 0
          fi
          gh pr create --title "Bump default php-cs-fixer to ${TAG}" --body "$(cat <<EOF
          ## Summary
          - Update the default \`php-cs-fixer-version\` to \`${TAG}\`
          - Pin the SHA-256 in \`checksums.txt\`
          - Rebuild \`dist/\`

          Generated by the weekly bump workflow.
          EOF
          )"
