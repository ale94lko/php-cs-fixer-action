name: Fix code styles
on: [pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP Code Style
        uses: ./
        with:
          php-cs-fixer-version: v3.95.21
          rules-version: v1.0.1
          use-full-rules: false
