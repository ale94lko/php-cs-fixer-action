name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Install ShellCheck and shfmt
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          curl -fsSL -o /tmp/shfmt "https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64"
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Lint shell scripts
        run: shellcheck --source-path=SCRIPTDIR --external-sources scripts/*.sh tests/*.sh

      - name: Check shell script formatting
        run: shfmt -d -i 2 scripts tests/*.sh

      - name: Test changelog release-notes extraction
        run: bash tests/extract-release-notes.test.sh

      - name: Test php-cs-fixer checksum lookup
        run: bash tests/vendor-php-cs-fixer.test.sh

      - name: Test dist Git Data API helper
        run: bash tests/commit-dist-tree.test.sh

      - name: Lint GitHub Actions workflows
        run: actionlint -color

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # Production deps are what ncc ships in dist/. --omit=dev skips only
      # devDependencies, not the runtime tree. High and critical fail the job.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify bundled dist
        run: |
          node scripts/check-dist.cjs
          npm run build
          node --check dist/index.js

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

  action-passes-on-clean-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP Code Style
        uses: ./
        with:
          config-path: tests/fixtures/.php-cs-fixer.dist.php
          mode: check

  action-fails-on-violations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Write a dirty fixture
        run: |
          # shellcheck disable=SC2016 # PHP snippet must keep $x unexpanded
          printf '%s\n' '<?php' 'class foo{' 'function Bar(){' '$x=1;' '}' '}' > tests/fixtures/Dirty.php

      - name: PHP Code Style
        id: fixer
        continue-on-error: true
        uses: ./
        with:
          config-path: tests/fixtures/.php-cs-fixer.dist.php
          mode: check

      - name: Expect the action to fail without a generic workflow error
        env:
          FIXER_OUTCOME: ${{ steps.fixer.outcome }}
        run: |
          if [[ "${FIXER_OUTCOME}" != "failure" ]]; then
            echo "Expected coding-standard violations to fail the action"
            exit 1
          fi
          if ! grep -q 'Dirty.php' result.txt; then
            echo "Expected a JSON report that names Dirty.php"
            cat result.txt
            exit 1
          fi

  action-fixes-dirty-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Write a dirty fixture
        run: |
          # shellcheck disable=SC2016 # PHP snippet must keep $x unexpanded
          printf '%s\n' '<?php' 'class foo{' 'function Bar(){' '$x=1;' '}' '}' > tests/fixtures/Dirty.php

      - name: PHP Code Style
        uses: ./
        with:
          config-path: tests/fixtures/.php-cs-fixer.dist.php
          mode: fix
          paths: tests/fixtures/Dirty.php

      - name: Expect the fixture to be rewritten
        run: |
          if ! grep -q 'public function Bar' tests/fixtures/Dirty.php; then
            echo "Expected mode=fix to rewrite tests/fixtures/Dirty.php"
            cat tests/fixtures/Dirty.php
            exit 1
          fi

  docker-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image with vendored php-cs-fixer
        run: docker build -t php-cs-fixer-action .

      - name: Lint fixtures without network
        run: docker run --rm --network=none php-cs-fixer-action
