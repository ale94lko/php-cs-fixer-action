name: 'ale94lko php-cs-fixer-action'
description: 'Action to fix PHP Code Standards'
author: 'Fidel Alejandro Fernandez Arias'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  php-cs-fixer-version:
    description: 'Version of php-cs-fixer to download'
    required: false
    default: 'v3.95.21'
  config-path:
    description: 'Path to a php-cs-fixer config file in the consuming repository. When set, rules from php-cs-fixer-rules are not downloaded.'
    required: false
    default: ''
  rules-version:
    description: 'Git ref (tag, branch or SHA) of ale94lko/php-cs-fixer-rules to download when config-path is empty'
    required: false
    default: 'v1.0.1'
  use-full-rules:
    description: 'Whether to use the full rules package or the minimal one from php-cs-fixer-rules'
    required: false
    default: 'true'
  mode:
    description: 'check runs php-cs-fixer with --dry-run (default). fix writes changes to the workspace.'
    required: false
    default: 'check'
  paths:
    description: 'Optional space-separated list of files or directories, relative to the workspace, passed to php-cs-fixer. Empty uses the config finder.'
    required: false
    default: ''
  allow-risky:
    description: 'Pass --allow-risky=yes|no to php-cs-fixer. Default yes keeps prior Action behavior; set no to disable risky fixers.'
    required: false
    default: 'yes'
  only-changed:
    description: 'When true, run only on PHP files changed vs base-ref (git diff). Optional paths further restrict the set.'
    required: false
    default: 'false'
  base-ref:
    description: 'Git ref to diff against when only-changed is true (e.g. origin/main). Defaults to origin/$GITHUB_BASE_REF on pull_request.'
    required: false
    default: ''
outputs:
  code-style-result:
    description: 'Pure JSON report from php-cs-fixer stdout (files, applied fixers, diffs). Stderr diagnostics stay in the job log only.'
runs:
  using: node24
  main: dist/index.js
