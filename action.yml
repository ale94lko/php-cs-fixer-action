name: 'ale94lko php-cs-fixer-action'
description: 'Action to fix PHP Code Standards'
author: 'Fidel Alejandro Fernandez Arias'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  php-cs-fixer-version:
    description: 'Version of php-cs-fixer to download'
    required: false
    default: 'v3.95.21'
  rules-version:
    description: 'Version of rules to check'
    required: false
    default: 'v1.0.1'
  use-full-rules:
    description: 'Whether to use the full rules package or the minimal one'
    required: false
    default: 'true'
outputs:
  code-style-result:
    description: 'Report generated by php-cs-fixer'
    value: ${{ steps.php-cs-fixer.outputs.result }}
runs:
  using: 'composite'
  steps:
    - name: Download php-cs-fixer
      shell: bash
      run: |
        curl --fail -L https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/download/${{ inputs.php-cs-fixer-version }}/php-cs-fixer.phar -o php-cs-fixer
        chmod a+x php-cs-fixer

    - name: Download PHP CS Fixer rules full
      if: inputs.use-full-rules == 'true'
      shell: bash
      run: curl --fail -L https://github.com/ale94lko/php-cs-fixer-rules/releases/download/${{ inputs.rules-version }}/default.php-cs-fixer.dist.php -o .php-cs-fixer.dist.php

    - name: Download PHP CS Fixer rules minimal
      if: inputs.use-full-rules == 'false'
      shell: bash
      run: curl --fail -L https://github.com/ale94lko/php-cs-fixer-rules/releases/download/${{ inputs.rules-version }}/default.php-cs-fixer.dist.min.php -o .php-cs-fixer.dist.php

    - name: Run PHP CS Fixer
      id: php-cs-fixer
      shell: bash
      env:
        PHP_CS_FIXER_IGNORE_ENV: '1'
      run: |
        set +e
        ./php-cs-fixer fix \
          --verbose \
          --diff \
          --show-progress=none \
          --allow-risky=yes \
          --dry-run \
          --format=txt \
          2>&1 | tee ./result.txt
        exit_code=${PIPESTATUS[0]}
        set -e

        {
          echo "result<<PHP_CS_FIXER_EOF"
          cat ./result.txt
          echo "PHP_CS_FIXER_EOF"
        } >> "$GITHUB_OUTPUT"

        if [ "$exit_code" -ne 0 ]; then
          echo "::error::PHP CS Fixer found coding standard violations. See the detailed report above for files, fixers and diffs."
          exit "$exit_code"
        fi
