name: 'ale94lko php-cs-fixer-action'
description: 'Action to fix PHP Code Standards'
author: 'Fidel Alejandro Fernandez Arias'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  php-cs-fixer-version:
    description: 'Version of php-cs-fixer to download'
    required: false
    default: 'v3.95.21'
  config-path:
    description: 'Path to a php-cs-fixer config file in the consuming repository. When set, rules from php-cs-fixer-rules are not downloaded.'
    required: false
    default: ''
  rules-version:
    description: 'Git ref (tag, branch or SHA) of ale94lko/php-cs-fixer-rules to download when config-path is empty'
    required: false
    default: 'main'
  use-full-rules:
    description: 'Whether to use the full rules package or the minimal one from php-cs-fixer-rules'
    required: false
    default: 'true'
outputs:
  code-style-result:
    description: 'Report generated by php-cs-fixer'
    value: ${{ steps.php-cs-fixer.outputs.result }}
runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      env:
        PHP_CS_FIXER_VERSION: ${{ inputs.php-cs-fixer-version }}
        CONFIG_PATH: ${{ inputs.config-path }}
        RULES_VERSION: ${{ inputs.rules-version }}
        USE_FULL_RULES: ${{ inputs.use-full-rules }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/validate-inputs.sh"

    - name: Download php-cs-fixer
      shell: bash
      env:
        PHP_CS_FIXER_VERSION: ${{ inputs.php-cs-fixer-version }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/download-fixer.sh"

    - name: Resolve PHP CS Fixer config
      id: resolve-config
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        RULES_VERSION: ${{ inputs.rules-version }}
        USE_FULL_RULES: ${{ inputs.use-full-rules }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/resolve-config.sh"

    - name: Run PHP CS Fixer
      id: php-cs-fixer
      shell: bash
      env:
        PHP_CS_FIXER_IGNORE_ENV: '1'
        CONFIG_FILE: ${{ steps.resolve-config.outputs.config }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/run-fixer.sh"
